```html
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gemini Clone</title>

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-screen bg-gray-100">

<div class="flex h-full">

    <!-- Sidebar -->
    <aside class="w-64 bg-gray-200 p-4">
        <h2 class="font-bold text-lg mb-4">Recent</h2>

        <div id="recent-message-list">
        </div>
    </aside>

    <!-- Main Chat Section -->
    <main class="flex-1 flex flex-col items-center p-6">

        <!-- Welcome Message -->
        <div id="welcome" class="mt-20 text-center">
            <h1 class="text-4xl font-bold text-gray-800">
                Hello, I'm Gemini
            </h1>

            <p class="text-gray-500 mt-3">
                How can I help you today?
            </p>
        </div>

        <!-- Chat Messages -->
        <div id="chat-container"
             class="w-full max-w-3xl flex-1 overflow-y-auto p-4">
        </div>

        <!-- Chat Input -->
        <div class="w-full max-w-3xl mt-auto">

            <form hx-post="/api/chat"
                  hx-target="#chat-container"
                  hx-swap="beforeend"
                  hx-on::after-request="if(event.detail.successful) this.reset()"
                  class="flex items-center gap-3 bg-white rounded-3xl border p-4 shadow-sm">

                <input
                    type="text"
                    name="message"
                    placeholder="Ask Gemini anything..."
                    required
                    class="flex-1 outline-none bg-transparent text-gray-800"
                >

                <button
                    type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-full">
                    Send
                </button>

            </form>

            <p class="text-xs text-center text-gray-400 mt-3">
                Gemini can make mistakes. Check important information.
            </p>

        </div>

    </main>

</div>

</body>
</html>
```
