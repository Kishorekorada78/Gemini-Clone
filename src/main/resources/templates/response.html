```html
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="responseFragment"
     class="chat-response space-y-6 py-6">

    <!-- User Message -->
    <div class="flex justify-end">
        <div class="user-bubble">
            <p th:text="${message}"></p>
        </div>
    </div>

    <!-- Gemini Response -->
    <div class="flex gap-4">

        <div class="gemini-avatar">✦</div>

        <div class="gemini-content">

            <div class="font-semibold text-gray-700 mb-3">
                Gemini
            </div>

            <!-- Markdown content -->
            <div class="markdown-content"
                 th:attr="data-markdown=${response}">
            </div>

        </div>

    </div>

</div>

</body>
</html>
```
